<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <script>
      (() => {
        const key = "connect-bots:theme";
        let preference = "system";
        try {
          const saved = localStorage.getItem(key);
          if (saved === "light" || saved === "dark" || saved === "system") preference = saved;
        } catch {}
        let systemDark = true;
        try {
          systemDark = typeof matchMedia === "function"
            ? matchMedia("(prefers-color-scheme: dark)").matches
            : true;
        } catch {}
        const resolved = preference === "system" ? (systemDark ? "dark" : "light") : preference;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.classList.toggle("dark", resolved === "dark");
        document.querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", resolved === "dark" ? "#111111" : "#f7f7f7");
      })();
    </script>
    <meta name="description" content="Persistent AI bots that work as a team in their own workspaces." />
    <title>Connect Bots</title>
    <link rel="icon" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
